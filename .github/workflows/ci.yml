name: ci

on:
  push:
    branches: [main]
  pull_request:
  schedule:
    - cron: '0 7 1 * *'

jobs:
  links:
    name: Link check
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - name: Check links
        uses: lycheeverse/lychee-action@v2
        with:
          args: --config .lychee.toml --no-progress './**/*.md'
          fail: true

  data:
    name: Validate data files
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: "3.12"
      - name: Validate models.json and platforms.json
        run: |
          python3 - <<'EOF'
          import json

          required = {"name", "vendor", "url", "description",
                      "price_input_per_1m", "price_output_per_1m",
                      "price_verified", "pricing_url",
                      "status", "category", "features"}
          statuses = {"active", "maintenance", "archived", "commercial"}
          files = {
              "data/models.json": {"model"},
              "data/platforms.json": {"platform", "selfhost"},
          }
          total = 0
          for path, cats in files.items():
              data = json.load(open(path))
              assert isinstance(data, list) and data, f"{path} must be a non-empty list"
              for i, e in enumerate(data):
                  missing = required - e.keys()
                  assert not missing, f"{path} entry {i} ({e.get('name')}) missing {missing}"
                  assert e["category"] in cats, f"{path} entry {i} bad category {e['category']}"
                  assert e["status"] in statuses, f"{path} entry {i} bad status {e['status']}"
                  assert isinstance(e["price_verified"], bool), f"{path} entry {i} price_verified not bool"
                  assert e["url"].startswith("https://"), f"{path} entry {i} url must be https"
                  if e["price_verified"]:
                      assert e["pricing_url"].startswith("https://"), \
                          f"{path} entry {i} verified price needs https pricing_url"
                  assert isinstance(e["features"], list) and e["features"], \
                      f"{path} entry {i} features must be non-empty list"
              names = [e["name"] for e in data]
              assert len(names) == len(set(names)), f"{path} duplicate names"
              print(f"OK: {path}: {len(data)} entries validated")
              total += len(data)
          print(f"OK: {total} total entries validated")
          EOF
